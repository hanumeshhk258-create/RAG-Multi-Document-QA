# =============================================================================
# Render Blueprint Configuration for Public Deployment
# Intelligent Document Question Answering System Using RAG
# =============================================================================

services:
  - type: web
    name: intelligent-document-rag
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import os; os.environ['HF_HOME']='./model_cache'; os.environ['SENTENCE_TRANSFORMERS_HOME']='./model_cache'; from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', cache_folder='./model_cache')"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: HF_HOME
        value: ./model_cache
      - key: SENTENCE_TRANSFORMERS_HOME
        value: ./model_cache
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false  # Must be configured in Render Dashboard under Environment
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RAG_DATA_DIR
        value: ""    # Optional: Set to /var/data if mounting a Persistent Disk
      - key: DEBUG_RAG
        value: "false"
      - key: LLM_TIMEOUT
        value: "20"
      - key: MAX_OUTPUT_TOKENS
        value: "512"

# Note for Persistent Disk (Render Starter / Standard Plans):
# To retain uploaded PDFs and vector indexes across restarts on paid plans:
# Add the following under the service definition:
#   disk:
#     name: rag-data
#     mountPath: /var/data
#     sizeGB: 1
# And set envVar RAG_DATA_DIR to "/var/data".
