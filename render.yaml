# =============================================================================
# Render Blueprint Configuration for Public Deployment
# Intelligent Document Question Answering System Using RAG
# =============================================================================

services:
  - type: web
    name: intelligent-document-rag
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt && (python -c "import os, urllib.request; os.makedirs('model_cache', exist_ok=True); urllib.request.urlretrieve('https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx', 'model_cache/model.onnx')" || true)
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: HF_HOME
        value: ./model_cache
      - key: SENTENCE_TRANSFORMERS_HOME
        value: ./model_cache
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false  # Must be configured in Render Dashboard under Environment
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RAG_DATA_DIR
        value: ""    # Optional: Set to /var/data if mounting a Persistent Disk
      - key: DEBUG_RAG
        value: "false"
      - key: LLM_TIMEOUT
        value: "20"
      - key: MAX_OUTPUT_TOKENS
        value: "512"

# Note for Persistent Disk (Render Starter / Standard Plans):
# To retain uploaded PDFs and vector indexes across restarts on paid plans:
# Add the following under the service definition:
#   disk:
#     name: rag-data
#     mountPath: /var/data
#     sizeGB: 1
# And set envVar RAG_DATA_DIR to "/var/data".
